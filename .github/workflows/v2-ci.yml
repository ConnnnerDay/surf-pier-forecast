name: v2 CI

on:
  push:
    branches: ["main", "master", "claude/**"]
    paths: ["v2/**", ".github/workflows/v2-ci.yml"]
  pull_request:
    branches: ["main", "master"]
    paths: ["v2/**", ".github/workflows/v2-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app

      - name: Run tests
        run: pytest -q

      - name: Verify Alembic migrations apply cleanly
        run: |
          mkdir -p data
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build

      - name: Test
        run: npm test

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Not yet configured
        run: |
          echo "Auto-deploy on merge to main is a decision in docs/V2_PLAN.md,"
          echo "but there's no server/deploy target wired up yet. This job is a"
          echo "placeholder — replace it with the real deploy step once v2 has"
          echo "somewhere to deploy to."
