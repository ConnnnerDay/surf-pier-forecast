name: v2 CI

on:
  push:
    branches: ["main", "master", "claude/**"]
    paths: ["v2/**", ".github/workflows/v2-ci.yml"]
  pull_request:
    branches: ["main", "master"]
    paths: ["v2/**", ".github/workflows/v2-ci.yml"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app

      - name: Run tests
        run: pytest -q

      - name: Verify Alembic migrations apply cleanly
        run: |
          mkdir -p data
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2/backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: v2/backend
        run: pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: v2/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: v2/frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: v2/frontend
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v2/frontend/playwright-report/
          retention-days: 7

  e2e-live-network:
    name: E2E (live-network, manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2/backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: v2/backend
        run: pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: v2/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: v2/frontend
        run: npx playwright install --with-deps chromium

      - name: Run live-network e2e test (not required, informational only)
        working-directory: v2/frontend
        run: npm run test:e2e:live
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live-network
          path: v2/frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Not yet configured
        run: |
          echo "Auto-deploy on merge to main is a decision in docs/V2_PLAN.md,"
          echo "but there's no server/deploy target wired up yet. This job is a"
          echo "placeholder — replace it with the real deploy step once v2 has"
          echo "somewhere to deploy to."
