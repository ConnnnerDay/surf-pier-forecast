name: surf-pier-forecast

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: surf_pier
      POSTGRES_USER: surf_pier
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surf_pier -d surf_pier"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - surf-pier-postgres:/var/lib/postgresql/data

volumes:
  surf-pier-postgres:
