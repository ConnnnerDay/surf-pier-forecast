<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" fill="none">
  <!-- Line tie ring -->
  <circle cx="20" cy="55" r="5" stroke="#94a3b8" stroke-width="2"/>

  <!-- Head — bullet/torpedo shape, hard head -->
  <path d="M25 42 C38 36 58 36 68 44 C74 50 74 60 68 66 C58 74 38 74 25 68 C18 62 18 48 25 42 Z" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Head shine -->
  <path d="M30 42 C42 38 58 40 66 48 C56 40 40 38 30 44 Z" fill="white" opacity="0.35"/>

  <!-- Wire through head -->
  <line x1="68" y1="55" x2="78" y2="55" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Long skirted body — multiple flowing tentacle strands -->
  <!-- Outer strands (longer) -->
  <path d="M78 50 C105 42 145 36 178 30" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M78 53 C106 46 146 42 180 38" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M78 55 C106 55 148 55 182 55" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M78 57 C106 64 146 68 180 72" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M78 60 C105 68 145 74 178 80" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- White/lighter strands -->
  <path d="M78 52 C106 44 146 39 180 34" stroke="#f0f9ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M78 56 C106 58 148 60 182 62" stroke="#f0f9ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M78 58 C106 66 146 70 180 76" stroke="#f0f9ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Pink/red accent strands -->
  <path d="M78 51 C105 43 145 37 178 32" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M78 59 C105 67 145 73 178 78" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Skirt collar band -->
  <rect x="76" y="46" width="6" height="18" rx="2" fill="#1e40af" stroke="#1e3a8a" stroke-width="1"/>

  <!-- Hook at end of rigging wire (barely visible) -->
  <circle cx="183" cy="55" r="4" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
