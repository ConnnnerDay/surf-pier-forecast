<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" fill="none">
  <!-- Line tie at top of head -->
  <circle cx="50" cy="18" r="5" stroke="#94a3b8" stroke-width="2"/>

  <!-- Dart head — arrowhead / keel shape -->
  <path d="M50 23 C60 26 74 34 74 50 C74 60 64 68 50 68 C36 68 26 60 26 50 C26 34 40 26 50 23 Z" fill="#f472b6" stroke="#be185d" stroke-width="2"/>

  <!-- Head shine -->
  <path d="M44 26 C54 26 65 34 64 46 C58 34 50 28 44 30 Z" fill="white" opacity="0.35"/>

  <!-- Eye -->
  <circle cx="58" cy="43" r="4" fill="white"/>
  <circle cx="59" cy="43" r="2" fill="#0f172a"/>

  <!-- Hook shank running back from head -->
  <line x1="74" y1="55" x2="130" y2="55" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hook bend at end -->
  <path d="M130 55 Q140 55 142 64 Q144 73 136 76" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hook point barb -->
  <path d="M136 76 Q128 80 127 72" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Feather/bucktail dressing around hook collar -->
  <path d="M76 46 Q100 30 130 22" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M76 50 Q100 38 130 32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M76 55 Q100 48 130 46" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M76 60 Q100 62 130 64" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M76 64 Q100 72 130 78" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Pink accent strands -->
  <path d="M76 48 Q100 35 130 26" stroke="#f472b6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M76 62 Q100 68 130 72" stroke="#f472b6" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
