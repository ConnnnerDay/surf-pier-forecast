<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" fill="none">
  <!-- Line tie ring at nose -->
  <circle cx="20" cy="55" r="5" stroke="#94a3b8" stroke-width="2"/>

  <!-- Cupped/concave face of popper -->
  <path d="M25 40 C30 36 44 34 44 55 C44 74 30 74 25 70 C18 64 15 44 25 40 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  <!-- Cup interior (darker) -->
  <ellipse cx="32" cy="55" rx="10" ry="14" fill="#0369a1" opacity="0.5"/>

  <!-- Main body -->
  <path d="M44 38 C70 32 135 32 168 42 C175 46 178 52 175 58 C172 64 165 70 155 72 C125 78 68 76 44 72 C44 72 44 38 44 38 Z" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>

  <!-- Back half color block (darker) -->
  <path d="M110 33 C135 33 155 38 168 42 C175 46 178 52 175 58 C172 64 165 70 155 72 C138 76 118 76 110 75 Z" fill="#86efac" stroke="#16a34a" stroke-width="1" opacity="0.7"/>

  <!-- Belly -->
  <path d="M46 64 C80 70 140 70 172 60 C140 68 78 68 46 66 Z" fill="white" opacity="0.35"/>

  <!-- Splash marks around cup (representing popping action) -->
  <path d="M14 42 Q8 36 10 30" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M12 56 Q4 52 2 46" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M15 68 Q8 72 8 80" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Front treble -->
  <line x1="88" y1="76" x2="88" y2="84" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="88" cy="87" r="3" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M88 87 Q80 88 78 94 M88 87 Q88 91 86 96 M88 87 Q96 88 98 94" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Rear treble -->
  <line x1="148" y1="74" x2="148" y2="82" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="148" cy="85" r="3" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M148 85 Q140 86 138 92 M148 85 Q148 89 146 94 M148 85 Q156 86 158 92" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Tail ring -->
  <circle cx="173" cy="55" r="4" stroke="#94a3b8" stroke-width="1.8"/>
</svg>
