<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <text x="250" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">Heavy Spinning/Casting Rig (Big Gamefish)</text>

  <!-- Rod tip and heavy spinning/conventional reel -->
  <g transform="translate(30, 75)">
    <line x1="0" y1="22" x2="95" y2="8" stroke="#5a4a3a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="10" cy="27" rx="15" ry="10" fill="#555" stroke="#333" stroke-width="1.5"/>
    <text x="48" y="58" text-anchor="middle" font-size="10" fill="#555">Heavy spinning /</text>
    <text x="48" y="70" text-anchor="middle" font-size="10" fill="#555">conventional rod</text>
  </g>

  <!-- Cast / pitch arc -->
  <path d="M105 65 Q225 42 345 88" fill="none" stroke="#4a9eda" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M334 79 L345 88 L332 95" fill="none" stroke="#4a9eda" stroke-width="2"/>
  <text x="225" y="34" text-anchor="middle" font-size="10" fill="#4a9eda">pitched at cruising or surface-busting fish</text>

  <!-- Braid straight to leader, no float or bottom weight -->
  <line x1="120" y1="70" x2="235" y2="105" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="170" y="102" text-anchor="middle" font-size="11" fill="#555">Braid (30-50 lb)</text>

  <line x1="235" y1="105" x2="300" y2="160" stroke="#5da" stroke-width="2.5"/>
  <text x="295" y="128" text-anchor="middle" font-size="11" fill="#555" transform="rotate(50, 295, 128)">Fluoro leader, 3-5 ft</text>
  <text x="313" y="142" text-anchor="middle" font-size="10" fill="#888" transform="rotate(50, 313, 142)">50-80 lb</text>

  <!-- Big popper / live bait -->
  <g transform="translate(290, 160)">
    <path d="M0 6 L20 0 L34 8 L20 16 Z" fill="#f39c12" stroke="#c87f0a" stroke-width="1.5"/>
    <circle cx="6" cy="8" r="1.3" fill="#fff"/>
    <path d="M32 8 Q48 12 60 24 Q50 26 40 32 Q38 20 32 13" fill="#89c" stroke="#557" stroke-width="1" opacity="0.85"/>
    <text x="70" y="18" font-size="11" fill="#555">Big popper, jig, or</text>
    <text x="70" y="32" font-size="10" fill="#888">live bait pitched live</text>
  </g>

  <!-- Big fish silhouette near pilings/buoy -->
  <g transform="translate(385, 55)" opacity="0.7">
    <path d="M0 12 Q22 -10 50 12 Q22 34 0 12 Z" fill="#6f92ad" stroke="#4d6f8a" stroke-width="1"/>
    <path d="M50 12 L64 0 L64 24 Z" fill="#6f92ad" stroke="#4d6f8a" stroke-width="1"/>
  </g>
  <rect x="440" y="130" width="10" height="90" fill="#8a8a8a" stroke="#555" stroke-width="1"/>
  <text x="445" y="235" text-anchor="middle" font-size="9" fill="#888">piling / buoy</text>

  <!-- Legend box -->
  <rect x="15" y="245" width="470" height="60" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="264" font-size="11" fill="#333" font-weight="bold">Presentation:</text>
  <text x="30" y="282" font-size="10.5" fill="#555">Same no-weight cast-and-work presentation as the light version, scaled up in line and leader</text>
  <text x="30" y="295" font-size="10.5" fill="#555">strength to stop a hard first run from cobia, amberjack, big jacks, tarpon, and tuna.</text>
</svg>
