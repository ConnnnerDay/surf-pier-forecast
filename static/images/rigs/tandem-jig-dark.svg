<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="320" fill="#132235"/>
  <defs>
    <radialGradient id="beadGrad_e74c3c" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffc9bd"/>
      <stop offset="55%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
  </defs>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#7DD3FC">Tandem Jig Rig (Shad Dart Rig)</text>

  <!-- Main line -->
  <line x1="30" y1="70" x2="170" y2="70" stroke="#2a6" stroke-width="2.5" stroke-dasharray="8,4"/>
  <line x1="30" y1="69.2" x2="170" y2="69.2" stroke="#8fe6b8" stroke-width="0.80" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="100" y="60" text-anchor="middle" font-size="11" fill="#c8d3dd">Main line (6-10 lb)</text>

  <!-- Swivel (optional): an oval barrel body with a small wire eye at each end -->
  <ellipse cx="187.0" cy="70.0" rx="12.0" ry="7.0" fill="url(#steelGrad)" stroke="#333333" stroke-width="1.2" filter="url(#softShadow)"/>
  <circle cx="176.5" cy="70.0" r="4.3" fill="none" stroke="url(#steelGrad)" stroke-width="2.06" filter="url(#softShadow)"/>
  <circle cx="197.5" cy="70.0" r="4.3" fill="none" stroke="url(#steelGrad)" stroke-width="2.06" filter="url(#softShadow)"/>
  <ellipse cx="183.6" cy="67.5" rx="4.8" ry="2.2" fill="#ffffff" opacity="0.55" filter="url(#glossBlur)"/>
  <text x="187" y="58" text-anchor="middle" font-size="9" fill="#c8d3dd">Swivel</text>

  <!-- Leader to first jig -->
  <line x1="199" y1="70" x2="270" y2="70" stroke="#5da" stroke-width="2"/>
  <line x1="199" y1="69.4" x2="270" y2="69.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>
  <line x1="270" y1="70" x2="270" y2="120" stroke="#5da" stroke-width="2"/>
  <line x1="270" y1="69.4" x2="270" y2="119.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>

  <!-- First shad dart / jig -->
  <g transform="translate(255, 120)">
    <!-- Jig head -->
    <circle cx="15" cy="8" r="10" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
    <!-- Hook shank and bend -->
    <circle cx="15" cy="18" r="1.7" fill="none" stroke="url(#steelGrad)" stroke-width="1.58" filter="url(#softShadow)"/>
    <path d="M15 18 L15 30 Q15 42 24 42 Q32 42 32 32 Q32 24 26 20" fill="none" stroke="url(#steelGrad)" stroke-width="2.2" filter="url(#softShadow)"/>
    <circle cx="25" cy="19" r="1.8" fill="url(#steelGradDark)"/>
    <!-- Tail/body dressing -->
    <path d="M5 8 Q-5 3 -8 8 Q-5 13 5 8" fill="#e74c3c" stroke="#c0392b" stroke-width="0.8"/>
    <path d="M3 5 Q-8 0 -12 5 Q-8 10 3 12" fill="#f1c40f" stroke="#d4ac0d" stroke-width="0.8" opacity="0.7"/>
    <text x="45" y="15" font-size="11" fill="#c8d3dd" font-weight="bold">Jig #1</text>
    <text x="45" y="30" font-size="10" fill="#93a5b8">Shad dart</text>
    <text x="45" y="43" font-size="10" fill="#93a5b8">(1/16 - 1/4 oz)</text>
  </g>

  <!-- Leader between jigs -->
  <line x1="270" y1="162" x2="270" y2="220" stroke="#5da" stroke-width="2"/>
  <line x1="270" y1="161.4" x2="270" y2="219.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>
  <!-- Gap label -->
  <line x1="290" y1="165" x2="290" y2="217" stroke="#ff8a7a" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M290 168 L286 175 M290 168 L294 175" fill="none" stroke="#ff8a7a" stroke-width="1.2"/>
  <path d="M290 214 L286 207 M290 214 L294 207" fill="none" stroke="#ff8a7a" stroke-width="1.2"/>
  <text x="305" y="195" font-size="10" fill="#ff8a7a">18 in leader</text>
  <text x="305" y="208" font-size="9" fill="#93a5b8">(8-12 lb mono)</text>

  <!-- Second shad dart / jig -->
  <g transform="translate(255, 220)">
    <circle cx="15" cy="8" r="10" fill="url(#beadGrad_e74c3c)" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="15" cy="18" r="1.7" fill="none" stroke="url(#steelGrad)" stroke-width="1.58" filter="url(#softShadow)"/>
    <path d="M15 18 L15 30 Q15 42 24 42 Q32 42 32 32 Q32 24 26 20" fill="none" stroke="url(#steelGrad)" stroke-width="2.2" filter="url(#softShadow)"/>
    <circle cx="25" cy="19" r="1.8" fill="url(#steelGradDark)"/>
    <path d="M5 8 Q-5 3 -8 8 Q-5 13 5 8" fill="#f39c12" stroke="#e67e22" stroke-width="0.8"/>
    <path d="M3 5 Q-8 0 -12 5 Q-8 10 3 12" fill="#fff" stroke="#ccc" stroke-width="0.8" opacity="0.7"/>
    <text x="45" y="15" font-size="11" fill="#c8d3dd" font-weight="bold">Jig #2</text>
    <text x="45" y="30" font-size="10" fill="#93a5b8">Different color</text>
    <text x="45" y="43" font-size="10" fill="#93a5b8">to test preferences</text>
  </g>

  <!-- Current flow arrows -->
  <g transform="translate(120, 130)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#4a9eda" stroke-width="1.5"/>
    <polygon points="40,0 34,-4 34,4" fill="#4a9eda"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#4a9eda" stroke-width="1.5"/>
    <polygon points="40,20 34,16 34,24" fill="#4a9eda"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#4a9eda" stroke-width="1.5"/>
    <polygon points="40,40 34,36 34,44" fill="#4a9eda"/>
    <text x="20" y="60" text-anchor="middle" font-size="10" fill="#4a9eda">Current</text>
  </g>

  <!-- Legend -->
  <rect x="15" y="268" width="470" height="42" rx="6" fill="#0f2032" stroke="#2c4a68" stroke-width="1" filter="url(#softShadow)"/>
  <text x="30" y="286" font-size="11" fill="#e8eef3" font-weight="bold">Technique:</text>
  <text x="100" y="286" font-size="10.5" fill="#c8d3dd">Cast upstream and retrieve through current, or jig</text>
  <text x="30" y="301" font-size="10.5" fill="#c8d3dd">vertically. Standard for spring shad and herring runs.</text>
</svg>
