<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Kayak Live Bait Freeline Rig</text>

  <!-- Water surface -->
  <path d="M20 95 Q80 88 140 95 Q200 102 260 95 Q320 88 380 95 Q440 102 480 95" fill="none" stroke="#4a9eda" stroke-width="2" opacity="0.5"/>

  <!-- Kayak -->
  <g transform="translate(345, 60)">
    <path d="M0 20 Q10 5 55 5 Q100 5 110 20 Q100 32 55 32 Q10 32 0 20" fill="#e08a2e" stroke="#b06a1e" stroke-width="1.5"/>
    <ellipse cx="55" cy="18" rx="18" ry="7" fill="#c9701f" opacity="0.6"/>
    <text x="55" y="-6" text-anchor="middle" font-size="10" fill="#7a5a2e">Kayak (anchored upcurrent)</text>
  </g>

  <!-- Main line, nearly weightless -->
  <line x1="30" y1="70" x2="180" y2="70" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="105" y="60" text-anchor="middle" font-size="11" fill="#555">Main line (20-30 lb braid)</text>

  <!-- Split shot only -->
  <circle cx="195" cy="80" r="5" fill="#999" stroke="#666" stroke-width="1.5"/>
  <text x="195" y="100" text-anchor="middle" font-size="10" fill="#555">Split shot</text>
  <text x="195" y="112" text-anchor="middle" font-size="9" fill="#888">(minimal / none)</text>

  <!-- Leader -->
  <line x1="200" y1="82" x2="230" y2="160" stroke="#5da" stroke-width="2"/>
  <text x="255" y="120" text-anchor="middle" font-size="11" fill="#555" transform="rotate(65, 255, 120)">Fluoro leader, 2-4 ft</text>

  <!-- Circle hook -->
  <g transform="translate(220, 160)">
    <path d="M8 0 L8 20 Q8 34 20 34 Q30 34 30 22 Q30 14 22 10" fill="none" stroke="#444" stroke-width="2.5"/>
    <circle cx="21" cy="9" r="2" fill="#444"/>
    <text x="40" y="16" font-size="11" fill="#555">Circle hook (3/0-5/0)</text>
  </g>

  <!-- Live baitfish swimming freely -->
  <g transform="translate(200, 210)">
    <path d="M0 10 Q20 -6 45 10 Q20 26 0 10" fill="#b8d4e8" stroke="#7ba3c4" stroke-width="1.5"/>
    <path d="M0 10 L-14 0 L-14 20 Z" fill="#b8d4e8" stroke="#7ba3c4" stroke-width="1"/>
    <circle cx="34" cy="7" r="1.5" fill="#333"/>
    <text x="55" y="14" font-size="10" fill="#888">Live baitfish or shrimp</text>
    <text x="55" y="26" font-size="10" fill="#888">swims freely toward structure</text>
  </g>

  <!-- Legend box -->
  <rect x="15" y="255" width="470" height="50" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="274" font-size="11" fill="#333" font-weight="bold">Technique:</text>
  <text x="30" y="292" font-size="10.5" fill="#555">Anchor the kayak upcurrent and let the lightly-weighted bait drift into the strike zone near</text>
  <text x="30" y="304" font-size="9.5" fill="#888">structure — snook, cobia, and tripletail track a struggling live bait from a distance.</text>
</svg>
