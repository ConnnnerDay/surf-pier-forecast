<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Light Spinning/Casting Rig</text>

  <!-- Rod tip and spinning reel -->
  <g transform="translate(30, 75)">
    <line x1="0" y1="20" x2="90" y2="10" stroke="#5a4a3a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="8" cy="24" rx="12" ry="8" fill="url(#steelGrad)" stroke="#333333" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="45" y="55" text-anchor="middle" font-size="10" fill="#555">Spinning / baitcasting rod</text>
  </g>

  <!-- Cast arc -->
  <path d="M100 65 Q220 48 340 90" fill="none" stroke="#4a9eda" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M330 82 L340 90 L328 96" fill="none" stroke="#4a9eda" stroke-width="1.5"/>
  <text x="220" y="38" text-anchor="middle" font-size="10" fill="#4a9eda">cast to schooling fish or mangrove edge</text>

  <!-- Line straight to leader, no float or bottom weight -->
  <line x1="120" y1="70" x2="240" y2="100" stroke="#2a6" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="175" y="98" text-anchor="middle" font-size="11" fill="#555">Braid (10-20 lb)</text>

  <line x1="240" y1="100" x2="300" y2="150" stroke="#5da" stroke-width="2"/>
  <text x="290" y="120" text-anchor="middle" font-size="11" fill="#555" transform="rotate(50, 290, 120)">Fluoro leader, 18-24 in</text>

  <!-- Jig head with soft plastic, unweighted presentation -->
  <g transform="translate(292, 150)">
    <path d="M8 0 Q18 0 18 10 Q18 17 8 17 Q0 17 0 8 Q0 0 8 0" fill="#e74c3c" stroke="#b03a2e" stroke-width="1.5"/>
    <circle cx="6" cy="6" r="1.2" fill="#fff"/>
    <path d="M16 10 Q34 15 47 26 Q36 28 26 34 Q24 22 16 15" fill="#88c" stroke="#557" stroke-width="1" opacity="0.85"/>
    <text x="58" y="14" font-size="11" fill="#555">Jig head + soft plastic</text>
    <text x="58" y="28" font-size="10" fill="#888">or lightly-weighted live bait</text>
  </g>

  <!-- Surface schooling fish -->
  <g transform="translate(390, 60)" opacity="0.7">
    <path d="M0 8 Q10 -4 24 8 Q10 20 0 8" fill="#7ba3c4" stroke="#5a83a4" stroke-width="1"/>
    <path d="M18 10 Q28 0 38 10 Q28 20 18 10" fill="#7ba3c4" stroke="#5a83a4" stroke-width="1"/>
    <text x="20" y="30" text-anchor="middle" font-size="9" fill="#5a83a4">surface-schooling fish</text>
  </g>

  <!-- Legend box -->
  <rect x="15" y="240" width="470" height="55" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="260" font-size="11" fill="#333" font-weight="bold">Presentation:</text>
  <text x="30" y="278" font-size="10.5" fill="#555">No float or sinker — cast directly to visible fish, current seams, or structure and work the</text>
  <text x="30" y="290" font-size="10.5" fill="#555">lure or bait back with a natural swimming action.</text>
</svg>
