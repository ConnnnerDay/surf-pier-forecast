<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="320" fill="#132235"/>
  <defs>
    <linearGradient id="waterTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0f2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bfe0f2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <defs>
    <linearGradient id="fishGrad_b8d4e8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ba3c4"/>
      <stop offset="55%" stop-color="#b8d4e8"/>
      <stop offset="100%" stop-color="#dfecf5"/>
    </linearGradient>
  </defs>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#7DD3FC">Kayak Live Bait Freeline Rig</text>

  <!-- Water surface -->
  <rect x="15" y="95" width="480" height="26" fill="url(#waterTint)"/>

  <path d="M20 95 Q80 88 140 95 Q200 102 260 95 Q320 88 380 95 Q440 102 480 95" fill="none" stroke="#4a9eda" stroke-width="2" opacity="0.5"/>

  <!-- Kayak -->
  <g transform="translate(345, 60)">
    <path d="M0 20 Q10 5 55 5 Q100 5 110 20 Q100 32 55 32 Q10 32 0 20" fill="#e08a2e" stroke="#b06a1e" stroke-width="1.5"/>
    <ellipse cx="55" cy="18" rx="18" ry="7" fill="#c9701f" opacity="0.6"/>
    <text x="55" y="-6" text-anchor="middle" font-size="10" fill="#7a5a2e">Kayak (anchored upcurrent)</text>
  </g>

  <!-- Main line, nearly weightless -->
  <line x1="30" y1="70" x2="180" y2="70" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="30" y1="69.2" x2="180" y2="69.2" stroke="#8fe6b8" stroke-width="0.96" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="105" y="60" text-anchor="middle" font-size="11" fill="#c8d3dd">Main line (20-30 lb braid)</text>

  <!-- Split shot only -->
  <circle cx="195" cy="80" r="5" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="193.4" cy="78.2" rx="1.6" ry="1.6" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <text x="195" y="100" text-anchor="middle" font-size="10" fill="#c8d3dd">Split shot</text>
  <text x="195" y="112" text-anchor="middle" font-size="9" fill="#93a5b8">(minimal / none)</text>

  <!-- Leader -->
  <line x1="200" y1="82" x2="230" y2="160" stroke="#5da" stroke-width="2"/>
  <line x1="200" y1="81.4" x2="230" y2="159.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>
  <text x="255" y="120" text-anchor="middle" font-size="11" fill="#c8d3dd" transform="rotate(65, 255, 120)">Fluoro leader, 2-4 ft</text>

  <!-- Circle hook -->
  <g transform="translate(222, 160)">
    <circle cx="8" cy="0" r="2.8" fill="none" stroke="url(#steelGrad)" stroke-width="1.8" filter="url(#softShadow)"/>
    <path d="M8 0 L8 20 Q8 34 20 34 Q30 34 30 22 Q30 14 22 10" fill="none" stroke="url(#steelGrad)" stroke-width="2.5" filter="url(#softShadow)"/>
    <circle cx="21" cy="9" r="2" fill="url(#steelGradDark)"/>
    <text x="40" y="16" font-size="11" fill="#c8d3dd">Circle hook (3/0-5/0)</text>
  </g>

  <!-- Live baitfish swimming freely -->
  <g transform="translate(200, 210)">
    <path d="M0 10 Q20 -6 45 10 Q20 26 0 10" fill="url(#fishGrad_b8d4e8)" stroke="#7ba3c4" stroke-width="1.5"/>
    <path d="M0 10 L-14 0 L-14 20 Z" fill="url(#fishGrad_b8d4e8)" stroke="#7ba3c4" stroke-width="1"/>
    <circle cx="34" cy="7" r="1.5" fill="url(#steelGradDark)"/>
    <text x="55" y="14" font-size="10" fill="#93a5b8">Live baitfish or shrimp</text>
    <text x="55" y="26" font-size="10" fill="#93a5b8">swims freely toward structure</text>
  </g>

  <!-- Legend box -->
  <rect x="15" y="253" width="470" height="60" rx="6" fill="#0f2032" stroke="#2c4a68" stroke-width="1" filter="url(#softShadow)"/>
  <text x="30" y="271" font-size="11" fill="#e8eef3" font-weight="bold">Technique:</text>
  <text x="30" y="288" font-size="10.5" fill="#c8d3dd">Anchor the kayak upcurrent and let the lightly-weighted bait drift into the strike zone near</text>
  <text x="30" y="303" font-size="9.5" fill="#93a5b8">structure — snook, cobia, and tripletail track a struggling live bait from a distance.</text>
</svg>
