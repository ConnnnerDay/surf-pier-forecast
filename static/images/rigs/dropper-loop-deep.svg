<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="Arial, sans-serif">
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Deep Dropper Loop Rig</text>

  <!-- Depth gradient background -->
  <rect x="15" y="45" width="470" height="230" fill="#dbe9f4"/>
  <rect x="15" y="45" width="470" height="230" fill="url(#depthGrad)"/>
  <defs>
    <linearGradient id="depthGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf4fb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2c5f8a" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <text x="470" y="60" text-anchor="end" font-size="9" fill="#3a6a90">surface</text>
  <text x="470" y="260" text-anchor="end" font-size="9" fill="#eaf4fb">100-500+ ft</text>

  <!-- Main line down -->
  <line x1="60" y1="50" x2="60" y2="90" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="60" y="42" text-anchor="middle" font-size="10" fill="#345">Braid (50-80 lb)</text>
  <line x1="60" y1="90" x2="60" y2="250" stroke="#5da" stroke-width="2"/>

  <!-- Dropper loop hooks, 3 of them -->
  <g>
    <path d="M60 120 Q90 120 90 135" fill="none" stroke="#5da" stroke-width="1.75"/>
    <path d="M90 135 L90 150 Q90 158 98 158 Q104 158 104 152 Q104 148 99 145" fill="none" stroke="#eee" stroke-width="2"/>
    <circle cx="103" cy="147" r="1.5" fill="#eee"/>
    <text x="115" y="140" font-size="10" fill="#eaf4fb">Dropper 1</text>
  </g>
  <g>
    <path d="M60 170 Q90 170 90 185" fill="none" stroke="#5da" stroke-width="1.75"/>
    <path d="M90 185 L90 200 Q90 208 98 208 Q104 208 104 202 Q104 198 99 195" fill="none" stroke="#eee" stroke-width="2"/>
    <circle cx="103" cy="197" r="1.5" fill="#eee"/>
    <text x="115" y="190" font-size="10" fill="#eaf4fb">Dropper 2</text>
  </g>
  <g>
    <path d="M60 218 Q90 218 90 233" fill="none" stroke="#5da" stroke-width="1.75"/>
    <path d="M90 233 L90 248 Q90 256 98 256 Q104 256 104 250 Q104 246 99 243" fill="none" stroke="#eee" stroke-width="2"/>
    <circle cx="103" cy="245" r="1.5" fill="#eee"/>
    <text x="115" y="238" font-size="10" fill="#eaf4fb">Dropper 3</text>
  </g>

  <!-- Heavy sinker at the bottom -->
  <ellipse cx="60" cy="270" rx="14" ry="28" fill="#888" stroke="#555" stroke-width="1.5"/>
  <text x="60" y="315" text-anchor="middle" font-size="10" fill="#555">Heavy bank / torpedo</text>
  <text x="60" y="328" text-anchor="middle" font-size="10" fill="#555">sinker — reaches bottom</text>
  <text x="60" y="341" text-anchor="middle" font-size="10" fill="#555">fast and holds in current</text>

  <!-- Rocky bank -->
  <path d="M180 275 Q220 250 260 272 Q300 245 340 270 Q380 250 420 272 Q450 258 480 272 L480 280 L180 280 Z" fill="#7a8a9a" stroke="#5a6a7a" stroke-width="1.5"/>
  <text x="330" y="300" text-anchor="middle" font-size="10" fill="#555">Offshore rocky bank / reef</text>

  <!-- Legend box -->
  <rect x="15" y="315" width="470" height="35" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="337" font-size="10.5" fill="#555">Dropped straight down to schooling rockfish and reef fish spotted on sonar; jig with a slow lift.</text>
</svg>
