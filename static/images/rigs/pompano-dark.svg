<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="400" fill="#132235"/>
  <defs>
    <radialGradient id="beadGrad_f1c40f" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fff3c0"/>
      <stop offset="55%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#d4ac0d"/>
    </radialGradient>
    <radialGradient id="beadGrad_FF6B35" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffc199"/>
      <stop offset="55%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#e55520"/>
    </radialGradient>
    <radialGradient id="beadGrad_e74c3c" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffc9bd"/>
      <stop offset="55%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
  </defs>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#7DD3FC">Pompano Rig</text>

  <!-- Main line -->
  <line x1="30" y1="60" x2="150" y2="60" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="30" y1="59.2" x2="150" y2="59.2" stroke="#8fe6b8" stroke-width="0.96" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="90" y="52" text-anchor="middle" font-size="11" fill="#c8d3dd">Main line</text>

  <!-- Swivel: an oval barrel body with a small wire eye at each end -->
  <ellipse cx="172.0" cy="60.0" rx="17.0" ry="8.0" fill="url(#steelGrad)" stroke="#333333" stroke-width="1.2" filter="url(#softShadow)"/>
  <circle cx="156.8" cy="60.0" r="5.0" fill="none" stroke="url(#steelGrad)" stroke-width="2.4" filter="url(#softShadow)"/>
  <circle cx="187.2" cy="60.0" r="5.0" fill="none" stroke="url(#steelGrad)" stroke-width="2.4" filter="url(#softShadow)"/>
  <ellipse cx="167.2" cy="57.2" rx="6.8" ry="2.6" fill="#ffffff" opacity="0.55" filter="url(#glossBlur)"/>
  <text x="172" y="46" text-anchor="middle" font-size="10" fill="#c8d3dd">Swivel</text>

  <!-- Vertical leader -->
  <line x1="189" y1="60" x2="250" y2="80" stroke="#68b" stroke-width="2.5"/>
  <line x1="250" y1="80" x2="250" y2="320" stroke="#68b" stroke-width="2.5"/>
  <text x="278" y="100" font-size="11" fill="#c8d3dd">30-40 lb mono</text>

  <!-- Upper dropper with float bead -->
  <g>
    <ellipse cx="250" cy="140" rx="6" ry="8" fill="none" stroke="#68b" stroke-width="2"/>
    <line x1="244" y1="140" x2="108" y2="130" stroke="#68b" stroke-width="2"/>
    <!-- Float bead (bright colored) -->
    <ellipse cx="158" cy="133" rx="10" ry="7" fill="url(#beadGrad_FF6B35)" stroke="#e55520" stroke-width="1.5"/>
    <text x="158" y="120" text-anchor="middle" font-size="10" fill="#FF6B35">Float bead</text>
    <!-- Teaser beads -->
    <circle cx="140" cy="137" r="4" fill="url(#beadGrad_f1c40f)" stroke="#d4ac0d" stroke-width="1"/>
    <circle cx="140" cy="145" r="4" fill="url(#beadGrad_e74c3c)" stroke="#c0392b" stroke-width="1"/>
    <text x="118" y="143" text-anchor="end" font-size="9" fill="#93a5b8">Beads</text>
    <!-- Hook -->
    <g transform="translate(108, 130)">
      <circle cx="0" cy="0" r="2.2" fill="none" stroke="url(#steelGrad)" stroke-width="1.44" filter="url(#softShadow)"/>
      <path d="M0 0 L0 16 Q0 26 8 26 Q16 26 16 18 Q16 12 12 9" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
      <path d="M13.14 11.73 L17.73 10.86 L13.14 13.98 Z" fill="url(#steelGradDark)"/>
    </g>
    <text x="85" y="158" text-anchor="middle" font-size="10" fill="#c8d3dd">Hook #1</text>
  </g>

  <!-- Float lifts bait annotation -->
  <path d="M160 126 L160 108 L200 108" fill="none" stroke="#ff8a7a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="205" y="112" font-size="9" fill="#ff8a7a">Float lifts bait off bottom</text>

  <!-- Gap label -->
  <line x1="270" y1="148" x2="270" y2="215" stroke="#ff8a7a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="302" y="185" font-size="10" fill="#ff8a7a">12-18 in</text>

  <!-- Lower dropper with float bead -->
  <g>
    <ellipse cx="250" cy="222" rx="6" ry="8" fill="none" stroke="#68b" stroke-width="2"/>
    <line x1="244" y1="222" x2="108" y2="212" stroke="#68b" stroke-width="2"/>
    <ellipse cx="158" cy="215" rx="10" ry="7" fill="url(#beadGrad_FF6B35)" stroke="#e55520" stroke-width="1.5"/>
    <circle cx="140" cy="219" r="4" fill="url(#beadGrad_f1c40f)" stroke="#d4ac0d" stroke-width="1"/>
    <circle cx="140" cy="227" r="4" fill="url(#beadGrad_e74c3c)" stroke="#c0392b" stroke-width="1"/>
    <g transform="translate(108, 212)">
      <circle cx="0" cy="0" r="2.2" fill="none" stroke="url(#steelGrad)" stroke-width="1.44" filter="url(#softShadow)"/>
      <path d="M0 0 L0 16 Q0 26 8 26 Q16 26 16 18 Q16 12 12 9" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
      <path d="M13.14 11.73 L17.73 10.86 L13.14 13.98 Z" fill="url(#steelGradDark)"/>
    </g>
    <text x="85" y="240" text-anchor="middle" font-size="10" fill="#c8d3dd">Hook #2</text>
  </g>

  <!-- Pyramid sinker -->
  <g transform="translate(232, 320)">
    <polygon points="18,0 0,40 36,40" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="18" y="55" text-anchor="middle" font-size="11" fill="#c8d3dd">Pyramid sinker</text>
    <text x="18" y="68" text-anchor="middle" font-size="10" fill="#93a5b8">(2-4 oz)</text>
  </g>

  <!-- Sand bottom -->
  <line x1="30" y1="360" x2="470" y2="360" stroke="#d4b483" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="420" y="375" font-size="10" fill="#d4b483">Sand bottom</text>

  <!-- Legend -->
  <rect x="300" y="130" width="185" height="60" rx="6" fill="#0f2032" stroke="#2c4a68" stroke-width="1" filter="url(#softShadow)"/>
  <text x="315" y="150" font-size="11" fill="#e8eef3" font-weight="bold">Key difference:</text>
  <text x="315" y="167" font-size="10.5" fill="#c8d3dd">Float beads lift hooks off</text>
  <text x="315" y="181" font-size="10.5" fill="#c8d3dd">sand into the surf wash zone</text>
</svg>
