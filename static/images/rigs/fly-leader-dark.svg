<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="320" fill="#132235"/>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#7DD3FC">Saltwater Fly Leader Setup</text>

  <!-- Fly line (thick, weight-forward) -->
  <path d="M25 90 Q90 80 150 90" fill="none" stroke="#e8a33d" stroke-width="6" stroke-linecap="round"/>
  <text x="85" y="72" text-anchor="middle" font-size="11" fill="#c8d3dd">Weight-forward fly line</text>

  <!-- Tapered leader (butt to tippet, drawn as a narrowing wedge) -->
  <path d="M150 90 L250 90 L280 92" fill="none" stroke="#666" stroke-width="4"/>
  <path d="M250 90 L280 92" fill="none" stroke="#666" stroke-width="2"/>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#c8d3dd">Tapered leader</text>
  <text x="200" y="112" text-anchor="middle" font-size="10" fill="#93a5b8">7-12 ft, butt to mid-taper</text>

  <!-- Tippet -->
  <line x1="280" y1="92" x2="310" y2="130" stroke="#5da" stroke-width="1.5"/>
  <line x1="280" y1="91.4" x2="310" y2="129.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>
  <text x="335" y="100" text-anchor="middle" font-size="11" fill="#c8d3dd">Fluorocarbon</text>
  <text x="335" y="114" text-anchor="middle" font-size="10" fill="#93a5b8">tippet, 12-30 lb</text>

  <!-- Non-slip loop knot -->
  <circle cx="310" cy="130" r="5" fill="none" stroke="url(#steelGrad)" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="308.4" cy="128.2" rx="1.6" ry="1.6" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>

  <!-- Fly (Clouser-style) -->
  <g transform="translate(310, 130)">
    <path d="M0 0 L28 22" stroke="#444" stroke-width="2"/>
    <circle cx="4" cy="2" r="4" fill="#d4d4d4" stroke="#999" stroke-width="1"/>
    <path d="M4 6 Q0 24 -4 34 Q6 28 12 30 Q10 18 8 8" fill="#e0e0e0" stroke="#aaa" stroke-width="1" opacity="0.85"/>
    <path d="M4 6 Q8 22 14 32 Q4 28 -2 32 Q0 18 2 8" fill="#f0c14b" stroke="#c99a2e" stroke-width="1" opacity="0.7"/>
    <circle cx="28" cy="20" r="3.2" fill="none" stroke="url(#steelGrad)" stroke-width="1.44" filter="url(#softShadow)"/>
    <path d="M28 20 L28 46 Q28 60 40 60 Q50 60 50 48 Q50 40 44 36" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
  </g>
  <text x="360" y="165" font-size="11" fill="#c8d3dd">Clouser Minnow</text>
  <text x="360" y="179" font-size="9.5" fill="#93a5b8">(or Deceiver, Crab, Toad)</text>

  <!-- Legend box -->
  <rect x="15" y="240" width="470" height="65" rx="6" fill="#0f2032" stroke="#2c4a68" stroke-width="1" filter="url(#softShadow)"/>
  <text x="30" y="260" font-size="11" fill="#e8eef3" font-weight="bold">How it works:</text>
  <text x="30" y="278" font-size="10.5" fill="#c8d3dd">Fly line loads the rod and turns over the leader, tied to the fly with a non-slip loop knot for</text>
  <text x="30" y="292" font-size="10.5" fill="#c8d3dd">action. Leader/tippet: longer &amp; lighter for spooky flats fish, shorter &amp; heavier for wind.</text>
</svg>
