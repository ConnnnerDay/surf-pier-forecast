<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="360" fill="#132235"/>
  <defs>
    <linearGradient id="waterTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0f2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bfe0f2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <defs>
    <linearGradient id="fishGrad_b8d4e8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa8c4"/>
      <stop offset="55%" stop-color="#b8d4e8"/>
      <stop offset="100%" stop-color="#dfecf5"/>
    </linearGradient>
    <linearGradient id="fishGrad_9bc1d8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa8c4"/>
      <stop offset="55%" stop-color="#9bc1d8"/>
      <stop offset="100%" stop-color="#d2e3ed"/>
    </linearGradient>
    <radialGradient id="beadGrad_e74c3c" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffc9bd"/>
      <stop offset="55%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
  </defs>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#7DD3FC">King Mackerel Stinger Rig</text>

  <!-- Water surface -->
  <rect x="25" y="80" width="460" height="26" fill="url(#waterTint)"/>

  <path d="M30 80 Q80 70 130 80 Q180 90 230 80 Q280 70 330 80 Q380 90 430 80 Q460 75 470 80" fill="none" stroke="#4a9eda" stroke-width="2" opacity="0.5"/>

  <!-- Main line -->
  <line x1="30" y1="60" x2="170" y2="60" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="30" y1="59.2" x2="170" y2="59.2" stroke="#8fe6b8" stroke-width="0.96" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#c8d3dd">Main line (20-30 lb)</text>

  <!-- Float/balloon -->
  <g transform="translate(180, 40)">
    <ellipse cx="18" cy="18" rx="22" ry="18" fill="url(#beadGrad_e74c3c)" stroke="#c0392b" stroke-width="2" opacity="0.8"/>
    <text x="18" y="22" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Float</text>
  </g>

  <!-- Swivel: an oval barrel body with a small wire eye at each end -->
  <ellipse cx="190.0" cy="79.0" rx="15.0" ry="7.0" fill="url(#steelGrad)" stroke="#333333" stroke-width="1.2" filter="url(#softShadow)"/>
  <circle cx="176.5" cy="79.0" r="4.3" fill="none" stroke="url(#steelGrad)" stroke-width="2.06" filter="url(#softShadow)"/>
  <circle cx="203.5" cy="79.0" r="4.3" fill="none" stroke="url(#steelGrad)" stroke-width="2.06" filter="url(#softShadow)"/>
  <ellipse cx="185.8" cy="76.5" rx="6.0" ry="2.2" fill="#ffffff" opacity="0.55" filter="url(#glossBlur)"/>
  <text x="190" y="100" text-anchor="middle" font-size="10" fill="#c8d3dd">Swivel</text>

  <!-- Wire leader down to baitfish -->
  <path d="M190 86 L192 93 L188 100 L192 107 L188 114 L192 121 L188 128 L190 135" fill="none" stroke="url(#steelGrad)" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="210" y="120" font-size="10" fill="#c8d3dd">Wire leader</text>
  <text x="210" y="133" font-size="9" fill="#93a5b8">#4-#7 wire</text>

  <!-- Nose hook -->
  <g transform="translate(180, 135)">
    <circle cx="10" cy="0" r="1.9" fill="none" stroke="url(#steelGrad)" stroke-width="1.6" filter="url(#softShadow)"/>
    <path d="M10 0 L10 12 Q10 20 16 20 Q22 20 22 14 Q22 9 18 7" fill="none" stroke="url(#steelGrad)" stroke-width="2.2" filter="url(#softShadow)"/>
    <circle cx="17" cy="6" r="1.5" fill="url(#steelGradDark)"/>
  </g>
  <text x="140" y="148" text-anchor="end" font-size="11" fill="#c8d3dd">Nose hook</text>

  <!-- Baitfish body -->
  <g transform="translate(158, 150)">
    <path d="M0 22 Q15 5 50 10 Q80 12 105 18 Q120 22 130 22 Q120 22 105 26 Q80 32 50 34 Q15 39 0 22" fill="url(#fishGrad_b8d4e8)" stroke="#7aa8c4" stroke-width="1.5"/>
    <!-- Eye -->
    <circle cx="18" cy="22" r="5" fill="#fff" stroke="#555" stroke-width="1"/>
    <circle cx="19" cy="22" r="2.5" fill="url(#steelGradDark)"/>
    <!-- Tail -->
    <path d="M130 22 L148 12 L148 32 Z" fill="url(#fishGrad_9bc1d8)" stroke="#7aa8c4" stroke-width="1"/>
    <!-- Fins -->
    <path d="M45 12 L55 2 L65 10" fill="url(#fishGrad_9bc1d8)" stroke="#7aa8c4" stroke-width="1"/>
    <text x="65" y="52" text-anchor="middle" font-size="11" fill="#c8d3dd">Live baitfish (menhaden/mullet)</text>
  </g>

  <!-- Short wire to stinger treble -->
  <path d="M280 170 L288 168 L296 173 L303 169 L310 172" fill="none" stroke="url(#steelGrad)" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="330" y="160" font-size="10" fill="#c8d3dd">Short wire</text>

  <!-- Treble stinger hook near tail -->
  <g transform="translate(302, 172)">
    <line x1="8" y1="0" x2="8" y2="8" stroke="#444" stroke-width="2"/>
    <!-- Three prongs -->
    <path d="M8 8 L8 20 Q8 26 12 26 Q16 26 16 22" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
    <path d="M8 8 L2 18 Q-1 24 3 26 Q7 26 8 22" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
    <path d="M8 8 L14 18 Q17 24 13 26 Q9 26 8 22" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="16" cy="21" r="1.2" fill="url(#steelGradDark)"/>
    <circle cx="2" cy="22" r="1.2" fill="url(#steelGradDark)"/>
    <circle cx="16" cy="22" r="1.2" fill="url(#steelGradDark)"/>
  </g>
  <text x="340" y="192" font-size="11" fill="#ff8a7a" font-weight="bold">Stinger treble</text>
  <text x="340" y="206" font-size="10" fill="#93a5b8">(catches short strikes)</text>

  <!-- Annotation arrow showing king strike pattern -->
  <g transform="translate(50, 210)">
    <path d="M0 20 Q40 0 80 15 Q120 30 160 10" fill="none" stroke="#ff8a7a" stroke-width="1.5" stroke-dasharray="5,3"/>
    <polygon points="160,10 148,8 152,18" fill="#ff8a7a"/>
    <text x="80" y="50" text-anchor="middle" font-size="10" fill="#ff8a7a">King strikes at tail first</text>
  </g>

  <!-- Legend -->
  <rect x="15" y="280" width="470" height="68" rx="6" fill="#0f2032" stroke="#2c4a68" stroke-width="1" filter="url(#softShadow)"/>
  <text x="30" y="300" font-size="11" fill="#e8eef3" font-weight="bold">Why a stinger?</text>
  <text x="30" y="318" font-size="10.5" fill="#c8d3dd">King mackerel attack from behind, slashing at the tail of the baitfish. A single</text>
  <text x="30" y="333" font-size="10.5" fill="#c8d3dd">nose hook misses most strikes. The trailing treble catches these short-strikers.</text>
</svg>
