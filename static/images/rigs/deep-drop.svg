<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="470" fill="#FAFAF8"/>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#baffcf" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#2ecc71" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#d6ffe4"/>
      <stop offset="45%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#1e8e4f"/>
    </radialGradient>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Deep Drop Rig</text>

  <!-- Depth scale on left -->
  <g transform="translate(30, 60)">
    <line x1="0" y1="0" x2="0" y2="300" stroke="#4a9eda" stroke-width="1.5"/>
    <text x="5" y="8" font-size="9" fill="#4a9eda">Surface</text>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#4a9eda" stroke-width="1.5"/>
    <text x="5" y="80" font-size="9" fill="#4a9eda">200 ft</text>
    <line x1="-5" y1="75" x2="5" y2="75" stroke="#4a9eda" stroke-width="1.5"/>
    <text x="5" y="155" font-size="9" fill="#4a9eda">500 ft</text>
    <line x1="-5" y1="150" x2="5" y2="150" stroke="#4a9eda" stroke-width="1.5"/>
    <text x="5" y="230" font-size="9" fill="#4a9eda">1000 ft</text>
    <line x1="-5" y1="225" x2="5" y2="225" stroke="#4a9eda" stroke-width="1.5"/>
    <text x="5" y="305" font-size="9" fill="#4a9eda">1500 ft</text>
    <line x1="-5" y1="300" x2="5" y2="300" stroke="#4a9eda" stroke-width="1.5"/>
    <!-- Gradient background -->
    <rect x="12" y="0" width="6" height="300" fill="url(#depth-gradient)" opacity="0.3"/>
  </g>
  <defs>
    <linearGradient id="depth-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>

  <!-- Main line from electric reel -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="url(#steelGradDark)" stroke="#222222" stroke-width="2" filter="url(#softShadow)"/>
    <ellipse cx="15.6" cy="8.4" rx="9.6" ry="6.0" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
    <circle cx="30" cy="15" r="10" fill="url(#steelGradDark)" stroke="#222222" stroke-width="1" filter="url(#softShadow)"/>
    <ellipse cx="26.8" cy="11.5" rx="3.2" ry="3.2" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
    <circle cx="30" cy="15" r="4" fill="url(#steelGradDark)" stroke="#222222" stroke-width="1" filter="url(#softShadow)"/>
    <ellipse cx="28.7" cy="13.6" rx="1.3" ry="1.3" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
    <text x="30" y="48" text-anchor="middle" font-size="10" fill="#555">Electric reel</text>
  </g>
  <text x="180" y="65" font-size="10" fill="#555">80-130 lb braid</text>

  <!-- Long main line going down -->
  <line x1="130" y1="80" x2="230" y2="120" stroke="#2a6" stroke-width="3"/>
  <line x1="130" y1="79.2" x2="230" y2="119.2" stroke="#8fe6b8" stroke-width="0.96" opacity="0.6"/>
  <line x1="230" y1="120" x2="230" y2="340" stroke="#2a6" stroke-width="3"/>
  <line x1="230" y1="119.2" x2="230" y2="339.2" stroke="#8fe6b8" stroke-width="0.96" opacity="0.6"/>

  <!-- Heavy swivel: an oval barrel body with a small wire eye at each end -->
  <ellipse cx="230.0" cy="132.0" rx="14.0" ry="7.0" fill="url(#steelGrad)" stroke="#333333" stroke-width="1.2" filter="url(#softShadow)"/>
  <circle cx="217.5" cy="132.0" r="4.3" fill="none" stroke="url(#steelGrad)" stroke-width="2.06" filter="url(#softShadow)"/>
  <circle cx="242.5" cy="132.0" r="4.3" fill="none" stroke="url(#steelGrad)" stroke-width="2.06" filter="url(#softShadow)"/>
  <ellipse cx="226.1" cy="129.6" rx="5.6" ry="2.2" fill="#ffffff" opacity="0.55" filter="url(#glossBlur)"/>
  <text x="260" y="136" font-size="10" fill="#555">Heavy swivel</text>

  <!-- Leader section -->
  <line x1="230" y1="139" x2="230" y2="340" stroke="#68b" stroke-width="2.5"/>
  <text x="255" y="160" font-size="10" fill="#555">100-200 lb mono</text>

  <!-- Dropper 1 with LED -->
  <g>
    <ellipse cx="230" cy="185" rx="5" ry="7" fill="none" stroke="#68b" stroke-width="2"/>
    <line x1="225" y1="185" x2="165" y2="185" stroke="#68b" stroke-width="2"/>
    <!-- Light glow -->
    <circle cx="175" cy="180" r="14" fill="url(#ledGlow)"/>
    <!-- LED light -->
    <rect x="168" y="176" width="14" height="8" rx="3" fill="url(#ledBody)" stroke="#1e8e4f" stroke-width="1"/>
    <text x="155" y="182" text-anchor="end" font-size="9" fill="#2ecc71">LED light</text>
    <!-- Hook -->
    <g transform="translate(165, 185)">
      <circle cx="0" cy="0" r="2.0" fill="none" stroke="url(#steelGrad)" stroke-width="1.44" filter="url(#softShadow)"/>
      <path d="M0 0 L0 14 Q0 22 8 22 Q14 22 14 16 Q14 10 10 8" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
      <path d="M11.61 10.48 L15.97 8.80 L12.01 12.70 Z" fill="url(#steelGradDark)"/>
    </g>
    <text x="128" y="200" text-anchor="end" font-size="10" fill="#555">Hook #1</text>
  </g>

  <!-- Dropper 2 -->
  <g>
    <ellipse cx="230" cy="250" rx="5" ry="7" fill="none" stroke="#68b" stroke-width="2"/>
    <line x1="225" y1="250" x2="165" y2="250" stroke="#68b" stroke-width="2"/>
    <g transform="translate(165, 250)">
      <circle cx="0" cy="0" r="2.0" fill="none" stroke="url(#steelGrad)" stroke-width="1.44" filter="url(#softShadow)"/>
      <path d="M0 0 L0 14 Q0 22 8 22 Q14 22 14 16 Q14 10 10 8" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
      <path d="M11.61 10.48 L15.97 8.80 L12.01 12.70 Z" fill="url(#steelGradDark)"/>
    </g>
    <text x="128" y="265" text-anchor="end" font-size="10" fill="#555">Hook #2</text>
  </g>

  <!-- Dropper 3 -->
  <g>
    <ellipse cx="230" cy="305" rx="5" ry="7" fill="none" stroke="#68b" stroke-width="2"/>
    <line x1="225" y1="305" x2="165" y2="305" stroke="#68b" stroke-width="2"/>
    <g transform="translate(165, 305)">
      <circle cx="0" cy="0" r="2.0" fill="none" stroke="url(#steelGrad)" stroke-width="1.44" filter="url(#softShadow)"/>
      <path d="M0 0 L0 14 Q0 22 8 22 Q14 22 14 16 Q14 10 10 8" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
      <path d="M11.61 10.48 L15.97 8.80 L12.01 12.70 Z" fill="url(#steelGradDark)"/>
    </g>
    <text x="128" y="320" text-anchor="end" font-size="10" fill="#555">Hook #3</text>
  </g>

  <!-- Heavy bank sinker -->
  <g transform="translate(218, 340)">
    <ellipse cx="12" cy="18" rx="14" ry="22" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="2" filter="url(#softShadow)"/>
    <ellipse cx="7.5" cy="9.6" rx="4.2" ry="4.8" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
    <text x="38" y="15" font-size="11" fill="#555">Bank sinker</text>
    <text x="38" y="30" font-size="10" fill="#888">(2-8 lbs!)</text>
  </g>

  <!-- Legend -->
  <rect x="290" y="200" width="195" height="95" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1" filter="url(#softShadow)"/>
  <text x="305" y="220" font-size="11" fill="#333" font-weight="bold">Target species:</text>
  <text x="305" y="237" font-size="10.5" fill="#555">Tilefish, snowy grouper,</text>
  <text x="305" y="252" font-size="10.5" fill="#555">barrelfish, swordfish</text>
  <text x="305" y="272" font-size="10" fill="#888">Requires boat with</text>
  <text x="305" y="285" font-size="10" fill="#888">electric reel setup</text>

  <!-- How it works -->
  <rect x="15" y="378" width="470" height="80" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1" filter="url(#softShadow)"/>
  <text x="30" y="398" font-size="11" fill="#333" font-weight="bold">How it works:</text>
  <text x="30" y="416" font-size="10.5" fill="#555">Extreme depth means extreme line weight and current drag, so an electric or manual</text>
  <text x="30" y="431" font-size="10.5" fill="#555">deep-drop reel does the lifting — a hand crank alone can't retrieve 2-8 lbs of lead from</text>
  <text x="30" y="446" font-size="10.5" fill="#555">1000+ ft. Multiple hooks let one drop catch several fish before the long haul back up.</text>
</svg>
