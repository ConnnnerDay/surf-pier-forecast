<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Light Bottom Rig (Reef &amp; Structure)</text>

  <!-- Main line -->
  <line x1="30" y1="80" x2="165" y2="80" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="97" y="70" text-anchor="middle" font-size="11" fill="#555">Main line (10-20 lb)</text>

  <!-- Small egg sinker -->
  <ellipse cx="190" cy="80" rx="16" ry="9" fill="#a0a0a0" stroke="#666" stroke-width="1.5"/>
  <ellipse cx="190" cy="80" rx="3" ry="9" fill="#888" stroke="#666" stroke-width="1"/>
  <text x="190" y="105" text-anchor="middle" font-size="10" fill="#555">Small egg sinker</text>

  <!-- Barrel swivel -->
  <rect x="220" y="73" width="26" height="14" rx="7" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="233" y="102" text-anchor="middle" font-size="10" fill="#555">Swivel</text>

  <!-- Leader with dropper loop -->
  <line x1="246" y1="80" x2="330" y2="80" stroke="#5da" stroke-width="2"/>
  <text x="288" y="70" text-anchor="middle" font-size="11" fill="#555">Light fluorocarbon leader (12-24 in)</text>

  <!-- Dropper loop hook -->
  <path d="M300 80 Q300 100 280 100" fill="none" stroke="#5da" stroke-width="2"/>
  <g transform="translate(272, 100)">
    <path d="M6 0 L6 14 Q6 24 15 24 Q22 24 22 16 Q22 10 16 7" fill="none" stroke="#444" stroke-width="2"/>
    <circle cx="15" cy="6" r="1.5" fill="#444"/>
    <text x="30" y="16" font-size="10" fill="#555">#2-1/0 hook</text>
  </g>

  <!-- Continue leader to a second, lower hook -->
  <line x1="330" y1="80" x2="330" y2="170" stroke="#5da" stroke-width="2"/>
  <g transform="translate(318, 170)">
    <path d="M6 0 L6 14 Q6 24 15 24 Q22 24 22 16 Q22 10 16 7" fill="none" stroke="#444" stroke-width="2"/>
    <circle cx="15" cy="6" r="1.5" fill="#444"/>
    <text x="35" y="16" font-size="10" fill="#555">2/0 hook</text>
  </g>

  <!-- Reef / rocky bottom -->
  <path d="M20 230 Q60 205 100 225 Q140 200 190 222 Q240 198 290 224 Q340 202 390 222 Q440 205 480 225 L480 260 L20 260 Z" fill="#8a9a7a" stroke="#6a7a5a" stroke-width="1.5"/>
  <circle cx="90" cy="220" r="5" fill="#7a8a6a" stroke="#5a6a4a" stroke-width="1"/>
  <circle cx="260" cy="218" r="6" fill="#7a8a6a" stroke="#5a6a4a" stroke-width="1"/>
  <text x="250" y="250" text-anchor="middle" font-size="10" fill="#4a5a3a">Sand / rock / grass bottom</text>

  <!-- Legend box -->
  <rect x="15" y="275" width="470" height="35" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="297" font-size="10.5" fill="#555">Just enough weight to hold near natural bottom without spooking line-shy reef and structure feeders.</text>
</svg>
