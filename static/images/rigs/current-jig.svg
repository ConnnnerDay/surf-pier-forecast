<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" font-family="Arial, sans-serif">
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Current Jig / Bridge Jig Rig</text>

  <!-- Bridge piling -->
  <rect x="410" y="45" width="30" height="260" rx="4" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
  <text x="425" y="38" text-anchor="middle" font-size="10" fill="#6B5335">Piling</text>
  <circle cx="417" cy="130" r="3" fill="#9a9" stroke="#686" stroke-width="1"/>
  <circle cx="432" cy="170" r="4" fill="#9a9" stroke="#686" stroke-width="1"/>
  <circle cx="418" cy="220" r="3" fill="#9a9" stroke="#686" stroke-width="1"/>

  <!-- Current arrows -->
  <path d="M455 90 L485 90 M478 84 L485 90 L478 96" fill="none" stroke="#4a9eda" stroke-width="2"/>
  <path d="M455 170 L485 170 M478 164 L485 170 L478 176" fill="none" stroke="#4a9eda" stroke-width="2"/>
  <text x="470" y="76" text-anchor="middle" font-size="10" fill="#4a9eda">current</text>

  <!-- Main line / rod tip -->
  <line x1="30" y1="60" x2="200" y2="60" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="105" y="50" text-anchor="middle" font-size="11" fill="#555">Main line (20-30 lb braid)</text>
  <line x1="200" y1="60" x2="255" y2="150" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Lift-drop motion arrows, in the clear zone above the jig -->
  <g transform="translate(60, 100)">
    <path d="M0 55 L0 0 M-5 8 L0 0 L5 8" fill="none" stroke="#c44" stroke-width="2"/>
    <path d="M20 0 L20 55 M15 47 L20 55 L25 47" fill="none" stroke="#c44" stroke-width="2" opacity="0.6"/>
    <text x="32" y="10" font-size="10" fill="#c44">lift</text>
    <text x="32" y="50" font-size="10" fill="#c44">drop</text>
  </g>

  <!-- Leader -->
  <line x1="255" y1="150" x2="270" y2="210" stroke="#5da" stroke-width="2.5"/>
  <text x="300" y="180" font-size="11" fill="#555">Fluorocarbon</text>
  <text x="300" y="195" font-size="11" fill="#555">leader (18-24 in)</text>

  <!-- Bucktail jig -->
  <g transform="translate(255, 210)">
    <circle cx="10" cy="10" r="9" fill="#e74c3c" stroke="#b03a2e" stroke-width="1.5"/>
    <path d="M10 18 Q4 40 -2 55 Q10 48 20 55 Q16 40 12 20" fill="#f1c40f" stroke="#c9a20e" stroke-width="1"/>
    <path d="M0 0 L4 4" stroke="#444" stroke-width="1.5"/>
  </g>
  <text x="290" y="225" font-size="10.5" fill="#555">Bucktail jig, 1-3 oz</text>

  <!-- Legend box -->
  <rect x="15" y="290" width="470" height="40" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="304" font-size="11" fill="#333" font-weight="bold">Technique:</text>
  <text x="120" y="304" font-size="10.5" fill="#555">Weight heavy enough to reach bottom in current. Drop straight down a</text>
  <text x="30" y="320" font-size="10.5" fill="#555">piling or jetty face and work a slow lift-drop. Sheepshead, snook, flounder.</text>
</svg>
