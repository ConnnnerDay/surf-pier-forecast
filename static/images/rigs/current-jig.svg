<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" font-family="Arial, sans-serif">
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Current Jig / Bridge Jig Rig</text>

  <!-- Bridge piling -->
  <rect x="360" y="45" width="34" height="260" rx="4" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
  <text x="377" y="38" text-anchor="middle" font-size="10" fill="#6B5335">Piling</text>
  <circle cx="368" cy="130" r="3" fill="#9a9" stroke="#686" stroke-width="1"/>
  <circle cx="384" cy="170" r="4" fill="#9a9" stroke="#686" stroke-width="1"/>
  <circle cx="370" cy="220" r="3" fill="#9a9" stroke="#686" stroke-width="1"/>

  <!-- Current arrows -->
  <path d="M420 90 L455 90 M448 84 L455 90 L448 96" fill="none" stroke="#4a9eda" stroke-width="2"/>
  <path d="M420 170 L455 170 M448 164 L455 170 L448 176" fill="none" stroke="#4a9eda" stroke-width="2"/>
  <text x="437" y="76" text-anchor="middle" font-size="10" fill="#4a9eda">current</text>

  <!-- Main line / rod tip -->
  <line x1="30" y1="60" x2="200" y2="60" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="105" y="50" text-anchor="middle" font-size="11" fill="#555">Main line (20-30 lb braid)</text>
  <line x1="200" y1="60" x2="255" y2="150" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Leader -->
  <line x1="255" y1="150" x2="270" y2="210" stroke="#5da" stroke-width="2.5"/>
  <text x="300" y="180" font-size="11" fill="#555">Fluorocarbon</text>
  <text x="300" y="195" font-size="11" fill="#555">leader (18-24 in)</text>

  <!-- Bucktail jig -->
  <g transform="translate(255, 210)">
    <circle cx="10" cy="10" r="9" fill="#e74c3c" stroke="#b03a2e" stroke-width="1.5"/>
    <path d="M10 18 Q4 40 -2 55 Q10 48 20 55 Q16 40 12 20" fill="#f1c40f" stroke="#c9a20e" stroke-width="1"/>
    <path d="M0 0 L4 4" stroke="#444" stroke-width="1.5"/>
    <text x="30" y="14" font-size="11" fill="#555">Bucktail / soft-plastic jig</text>
    <text x="30" y="28" font-size="10" fill="#888">1-3 oz — heavy enough to</text>
    <text x="30" y="40" font-size="10" fill="#888">reach bottom in current</text>
  </g>

  <!-- Lift-drop motion arrows -->
  <g transform="translate(210, 245)">
    <path d="M0 30 L0 0 M-5 8 L0 0 L5 8" fill="none" stroke="#c44" stroke-width="2"/>
    <path d="M0 40 L0 70 M-5 62 L0 70 L5 62" fill="none" stroke="#c44" stroke-width="2" opacity="0.6"/>
    <text x="12" y="20" font-size="9" fill="#c44">lift</text>
    <text x="12" y="62" font-size="9" fill="#c44">drop</text>
  </g>

  <!-- Legend box -->
  <rect x="15" y="290" width="470" height="40" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="308" font-size="11" fill="#333" font-weight="bold">Technique:</text>
  <text x="68" y="308" font-size="10.5" fill="#555">Drop straight down a piling or jetty face and work a slow lift-drop. Sheepshead, snook, flounder.</text>
</svg>
