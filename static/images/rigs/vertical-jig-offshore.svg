<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" font-family="Arial, sans-serif">
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Offshore Vertical Jig (Speed/Butterfly Jig)</text>

  <!-- Depth gradient water column -->
  <rect x="15" y="45" width="470" height="255" fill="#dbe9f4"/>
  <rect x="15" y="45" width="470" height="255" fill="url(#vjDepthGrad)"/>
  <defs>
    <linearGradient id="vjDepthGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf4fb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2c5f8a" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Main line straight to jig -->
  <line x1="90" y1="55" x2="90" y2="90" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="90" y1="54.2" x2="90" y2="89.2" stroke="#8fe6b8" stroke-width="0.96" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="30" y="70" font-size="10" fill="#345">Braid</text>
  <text x="30" y="83" font-size="10" fill="#345">50-65 lb</text>
  <line x1="90" y1="90" x2="90" y2="150" stroke="#5da" stroke-width="2"/>
  <text x="200" y="115" font-size="10" fill="#eaf4fb">Fluoro leader</text>
  <text x="200" y="128" font-size="10" fill="#eaf4fb">4-6 ft, 60-100 lb</text>

  <!-- Yo-yo stroke arrows -->
  <g transform="translate(140, 90)">
    <path d="M0 55 L0 0 M-5 8 L0 0 L5 8" fill="none" stroke="#c44" stroke-width="2.5"/>
    <text x="10" y="10" font-size="10" fill="#c44" font-weight="bold">rapid</text>
    <text x="10" y="24" font-size="10" fill="#c44" font-weight="bold">yo-yo</text>
    <text x="10" y="38" font-size="10" fill="#c44" font-weight="bold">stroke</text>
  </g>

  <!-- Butterfly/knife jig -->
  <g transform="translate(75, 150)">
    <path d="M15 0 L28 45 L15 80 L2 45 Z" fill="#c0c8d0" stroke="#8a95a0" stroke-width="1.5"/>
    <path d="M15 0 L15 80" stroke="#8a95a0" stroke-width="0.75" opacity="0.6"/>
    <circle cx="15" cy="4" r="2.5" fill="url(#steelGradDark)"/>
    <path d="M15 80 Q15 92 24 92 Q32 92 32 84 Q32 78 27 75" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
  </g>
  <text x="140" y="200" font-size="11" fill="#333" font-weight="bold">Knife / butterfly jig</text>
  <text x="140" y="214" font-size="10" fill="#666">100-400g, size to depth</text>
  <text x="140" y="227" font-size="10" fill="#666">and current</text>

  <!-- Structure / school marker -->
  <path d="M330 260 Q360 235 395 258 Q430 232 460 256 L460 270 L330 270 Z" fill="#7a8a9a" stroke="#5a6a7a" stroke-width="1.5"/>
  <text x="395" y="290" text-anchor="middle" font-size="10" fill="#555">Reef, wreck, or</text>
  <text x="395" y="303" text-anchor="middle" font-size="10" fill="#555">marked bait school</text>

  <!-- Legend box -->
  <rect x="15" y="320" width="470" height="48" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="338" font-size="11" fill="#333" font-weight="bold">Technique:</text>
  <text x="100" y="338" font-size="10.5" fill="#555">Drop to structure or a marked school, then work fast, continuous</text>
  <text x="30" y="354" font-size="10.5" fill="#555">lift-crank strokes. Speed and flash trigger reaction strikes.</text>
</svg>
