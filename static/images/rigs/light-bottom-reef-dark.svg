<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="320" fill="#132235"/>
  <defs>
    <linearGradient id="seafloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9fae8a"/>
      <stop offset="100%" stop-color="#6f7f5c"/>
    </linearGradient>
    <radialGradient id="pebbleGrad" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#b9c4a6"/>
      <stop offset="55%" stop-color="#7a8a6a"/>
      <stop offset="100%" stop-color="#4a5a3a"/>
    </radialGradient>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#7DD3FC">Light Bottom Rig (Reef &amp; Structure)</text>

  <!-- Main line -->
  <line x1="30" y1="80" x2="165" y2="80" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="30" y1="79.2" x2="165" y2="79.2" stroke="#8fe6b8" stroke-width="0.96" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="97" y="70" text-anchor="middle" font-size="11" fill="#c8d3dd">Main line (10-20 lb)</text>

  <!-- Small egg sinker -->
  <ellipse cx="190" cy="80" rx="16" ry="9" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="184.9" cy="76.6" rx="4.8" ry="2.0" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <ellipse cx="190" cy="80" rx="3" ry="9" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="1"/>
  <text x="190" y="105" text-anchor="middle" font-size="10" fill="#c8d3dd">Small egg sinker</text>

  <!-- Barrel swivel -->
  <rect x="220" y="73" width="26" height="14" rx="7" fill="url(#steelGrad)" stroke="#333333" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="226.8" cy="76.9" rx="4.2" ry="2.8" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <text x="233" y="122" text-anchor="middle" font-size="10" fill="#c8d3dd">Swivel</text>

  <!-- Leader with dropper loop -->
  <line x1="246" y1="80" x2="330" y2="80" stroke="#5da" stroke-width="2"/>
  <line x1="246" y1="79.4" x2="330" y2="79.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>
  <text x="288" y="70" text-anchor="middle" font-size="11" fill="#c8d3dd">Light fluorocarbon leader (12-24 in)</text>

  <!-- Dropper loop hook -->
  <path d="M300 80 Q300 100 280 100" fill="none" stroke="#5da" stroke-width="2"/>
  <g transform="translate(272, 100)">
    <path d="M6 0 L6 14 Q6 24 15 24 Q22 24 22 16 Q22 10 16 7" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="15" cy="6" r="1.5" fill="url(#steelGradDark)"/>
    <text x="30" y="16" font-size="10" fill="#c8d3dd">#2-1/0 hook</text>
  </g>

  <!-- Continue leader to a second, lower hook -->
  <line x1="330" y1="80" x2="330" y2="170" stroke="#5da" stroke-width="2"/>
  <line x1="330" y1="79.4" x2="330" y2="169.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>
  <g transform="translate(318, 170)">
    <path d="M6 0 L6 14 Q6 24 15 24 Q22 24 22 16 Q22 10 16 7" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="15" cy="6" r="1.5" fill="url(#steelGradDark)"/>
    <text x="35" y="16" font-size="10" fill="#c8d3dd">2/0 hook</text>
  </g>

  <!-- Reef / rocky bottom -->
  <path d="M20 230 Q60 205 100 225 Q140 200 190 222 Q240 198 290 224 Q340 202 390 222 Q440 205 480 225 L480 260 L20 260 Z" fill="url(#seafloorGrad)" stroke="#6a7a5a" stroke-width="1.5"/>
  <circle cx="90" cy="220" r="5" fill="url(#pebbleGrad)" stroke="#5a6a4a" stroke-width="1"/>
  <circle cx="260" cy="218" r="6" fill="url(#pebbleGrad)" stroke="#5a6a4a" stroke-width="1"/>
  <text x="250" y="250" text-anchor="middle" font-size="10" fill="#b8c9a0">Sand / rock / grass bottom</text>

  <!-- Legend box -->
  <rect x="15" y="275" width="470" height="35" rx="6" fill="#0f2032" stroke="#2c4a68" stroke-width="1" filter="url(#softShadow)"/>
  <text x="30" y="289" font-size="11" fill="#e8eef3" font-weight="bold">How it works:</text>
  <text x="30" y="304" font-size="10.5" fill="#c8d3dd">Just enough weight to hold near bottom without spooking line-shy reef and structure feeders.</text>
</svg>
