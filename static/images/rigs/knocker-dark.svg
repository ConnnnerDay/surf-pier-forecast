<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="350" fill="#132235"/>
  <defs>
    <linearGradient id="woodGrain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5a3a"/>
      <stop offset="12%" stop-color="#9c7a52"/>
      <stop offset="24%" stop-color="#7a5a3a"/>
      <stop offset="38%" stop-color="#8a6644"/>
      <stop offset="50%" stop-color="#9c7a52"/>
      <stop offset="63%" stop-color="#7a5a3a"/>
      <stop offset="78%" stop-color="#8a6644"/>
      <stop offset="90%" stop-color="#6b4f32"/>
      <stop offset="100%" stop-color="#7a5a3a"/>
    </linearGradient>
  </defs>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#7DD3FC">Knocker Rig</text>

  <!-- Main line -->
  <line x1="30" y1="80" x2="150" y2="80" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="30" y1="79.2" x2="150" y2="79.2" stroke="#8fe6b8" stroke-width="0.96" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="90" y="70" text-anchor="middle" font-size="11" fill="#c8d3dd">Main line (30-50 lb braid)</text>

  <!-- Barrel swivel: an oval barrel body with a small wire eye at each end -->
  <ellipse cx="172.0" cy="80.0" rx="17.0" ry="8.0" fill="url(#steelGrad)" stroke="#333333" stroke-width="1.2" filter="url(#softShadow)"/>
  <circle cx="156.8" cy="80.0" r="5.0" fill="none" stroke="url(#steelGrad)" stroke-width="2.4" filter="url(#softShadow)"/>
  <circle cx="187.2" cy="80.0" r="5.0" fill="none" stroke="url(#steelGrad)" stroke-width="2.4" filter="url(#softShadow)"/>
  <ellipse cx="167.2" cy="77.2" rx="6.8" ry="2.6" fill="#ffffff" opacity="0.55" filter="url(#glossBlur)"/>
  <text x="172" y="104" text-anchor="middle" font-size="10" fill="#c8d3dd">Barrel swivel</text>

  <!-- Leader going down -->
  <line x1="189" y1="80" x2="250" y2="100" stroke="#5da" stroke-width="2.5"/>
  <line x1="189" y1="79.4" x2="250" y2="99.4" stroke="#e8fbf3" stroke-width="0.85" opacity="0.55"/>
  <line x1="250" y1="100" x2="250" y2="220" stroke="#5da" stroke-width="2.5"/>
  <line x1="250" y1="99.4" x2="250" y2="219.4" stroke="#e8fbf3" stroke-width="0.85" opacity="0.55"/>
  <text x="290" y="130" font-size="11" fill="#c8d3dd">Fluorocarbon</text>
  <text x="290" y="145" font-size="11" fill="#c8d3dd">leader (12-24 in)</text>

  <!-- Egg sinker on leader - at the bottom near hook -->
  <ellipse cx="250" cy="195" rx="22" ry="12" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="243.0" cy="190.4" rx="6.6" ry="2.6" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <ellipse cx="250" cy="195" rx="4" ry="12" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="1"/>
  <text x="175" y="195" text-anchor="end" font-size="11" fill="#c8d3dd">Egg sinker</text>
  <text x="175" y="210" text-anchor="end" font-size="10" fill="#93a5b8">(slides on leader)</text>

  <!-- Arrow showing sinker rests against hook -->
  <path d="M250 210 L250 222" stroke="#ff8a7a" stroke-width="1.5"/>
  <text x="300" y="218" font-size="10" fill="#ff8a7a">Sinker rests</text>
  <text x="300" y="230" font-size="10" fill="#ff8a7a">on hook eye</text>

  <!-- Hook -->
  <g transform="translate(237, 222)">
    <circle cx="13" cy="0" r="3.2" fill="none" stroke="url(#steelGrad)" stroke-width="1.8" filter="url(#softShadow)"/>
    <path d="M13 0 L13 25 Q13 42 26 42 Q38 42 38 28 Q38 18 30 14" fill="none" stroke="url(#steelGrad)" stroke-width="2.5" filter="url(#softShadow)"/>
    <path d="M32.15 17.31 L37.96 15.07 L32.68 20.26 Z" fill="url(#steelGradDark)"/>
    <text x="48" y="18" font-size="11" fill="#c8d3dd">Circle hook</text>
    <text x="48" y="32" font-size="10" fill="#93a5b8">1/0 - 3/0</text>
  </g>

  <!-- Bait on hook -->
  <g transform="translate(244, 260)">
    <ellipse cx="8" cy="8" rx="14" ry="8" fill="url(#baitGrad)" stroke="#a8663a" stroke-width="1"/>
    <text x="8" y="28" text-anchor="middle" font-size="10" fill="#93a5b8">Fiddler crab / shrimp</text>
  </g>

  <!-- Pier piling illustration -->
  <rect x="400" y="40" width="30" height="240" rx="4" fill="url(#woodGrain)" stroke="#5a4326" stroke-width="2"/>
  <text x="415" y="35" text-anchor="middle" font-size="10" fill="#c9a876">Piling</text>
  <!-- Barnacles -->
  <circle cx="405" cy="120" r="3" fill="#9a9" stroke="#686" stroke-width="1"/>
  <circle cx="420" cy="150" r="4" fill="#9a9" stroke="#686" stroke-width="1"/>
  <circle cx="408" cy="200" r="3" fill="#9a9" stroke="#686" stroke-width="1"/>

  <!-- Legend -->
  <rect x="15" y="288" width="470" height="55" rx="6" fill="#0f2032" stroke="#2c4a68" stroke-width="1" filter="url(#softShadow)"/>
  <text x="30" y="305" font-size="11" fill="#e8eef3" font-weight="bold">How it works:</text>
  <text x="30" y="322" font-size="10.5" fill="#c8d3dd">The sinker rests right at the hook eye instead of sliding freely, so there's no slack</text>
  <text x="30" y="336" font-size="10.5" fill="#c8d3dd">line to let bait drift into a snag. Drop it straight down beside pilings and rocks.</text>
</svg>
