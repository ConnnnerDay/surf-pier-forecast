<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="500" height="320" fill="#132235"/>
  <defs>
    <radialGradient id="beadGrad_e74c3c" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffc9bd"/>
      <stop offset="55%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
  </defs>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <defs>
    <marker id="ff-hook" markerWidth="18" markerHeight="18" refX="5" refY="14" orient="auto">
      <path d="M5 0 L5 10 Q5 16 10 16 Q15 16 15 12" fill="none" stroke="url(#steelGrad)" stroke-width="2" filter="url(#softShadow)"/>
      <circle cx="14" cy="11" r="1.5" fill="url(#steelGradDark)"/>
    </marker>
  </defs>

  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#7DD3FC">Fish Finder Rig (Carolina Rig)</text>

  <!-- Main line -->
  <line x1="30" y1="80" x2="145" y2="80" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="30" y1="79.2" x2="145" y2="79.2" stroke="#8fe6b8" stroke-width="0.96" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="85" y="70" text-anchor="middle" font-size="11" fill="#c8d3dd">Main line (braid)</text>

  <!-- Sliding egg sinker -->
  <ellipse cx="180" cy="80" rx="28" ry="14" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="171.0" cy="74.7" rx="8.4" ry="3.1" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <ellipse cx="180" cy="80" rx="5" ry="14" fill="url(#leadGrad)" stroke="#4a4a4a" stroke-width="1"/>
  <text x="180" y="115" text-anchor="middle" font-size="11" fill="#c8d3dd">Sliding egg sinker</text>
  <text x="180" y="128" text-anchor="middle" font-size="10" fill="#93a5b8">(2-4 oz)</text>
  <!-- Arrow showing slide -->
  <path d="M155 60 L175 60 M170 55 L175 60 L170 65" fill="none" stroke="#ff8a7a" stroke-width="1.5"/>
  <path d="M205 60 L185 60 M190 55 L185 60 L190 65" fill="none" stroke="#ff8a7a" stroke-width="1.5"/>
  <text x="180" y="55" text-anchor="middle" font-size="9" fill="#ff8a7a">slides freely</text>

  <!-- Bead -->
  <circle cx="225" cy="80" r="6" fill="url(#beadGrad_e74c3c)" stroke="#c0392b" stroke-width="1.5"/>
  <text x="220" y="100" text-anchor="middle" font-size="10" fill="#c8d3dd">Bead</text>

  <!-- Barrel swivel -->
  <rect x="248" y="72" width="34" height="16" rx="8" fill="url(#steelGrad)" stroke="#333333" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="256.8" cy="76.5" rx="5.4" ry="3.2" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <circle cx="253" cy="80" r="4" fill="url(#steelGrad)" stroke="#333333" stroke-width="1" filter="url(#softShadow)"/>
  <ellipse cx="251.7" cy="78.6" rx="1.3" ry="1.3" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <circle cx="277" cy="80" r="4" fill="url(#steelGrad)" stroke="#333333" stroke-width="1" filter="url(#softShadow)"/>
  <ellipse cx="275.7" cy="78.6" rx="1.3" ry="1.3" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <text x="265" y="120" text-anchor="middle" font-size="10" fill="#c8d3dd">Barrel swivel</text>

  <!-- Leader -->
  <line x1="282" y1="80" x2="340" y2="80" stroke="#5da" stroke-width="2"/>
  <line x1="282" y1="79.4" x2="340" y2="79.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>
  <line x1="340" y1="80" x2="400" y2="160" stroke="#5da" stroke-width="2"/>
  <line x1="340" y1="79.4" x2="400" y2="159.4" stroke="#e8fbf3" stroke-width="0.70" opacity="0.55"/>
  <text x="360" y="108" text-anchor="middle" font-size="11" fill="#c8d3dd" transform="rotate(30, 360, 108)">Fluorocarbon leader</text>
  <text x="375" y="125" text-anchor="middle" font-size="10" fill="#93a5b8" transform="rotate(30, 375, 125)">18-36 in</text>

  <!-- Circle hook -->
  <g transform="translate(400, 158)">
    <path d="M0 0 L0 22 Q0 38 14 38 Q28 38 28 24 Q28 14 18 10" fill="none" stroke="url(#steelGrad)" stroke-width="2.5" filter="url(#softShadow)"/>
    <circle cx="17" cy="9" r="2" fill="url(#steelGradDark)"/>
    <text x="35" y="20" font-size="11" fill="#c8d3dd">Circle hook</text>
    <text x="35" y="34" font-size="10" fill="#93a5b8">2/0 - 5/0</text>
  </g>

  <!-- Bait -->
  <g transform="translate(392, 200)">
    <ellipse cx="12" cy="15" rx="18" ry="10" fill="url(#baitGrad)" stroke="#a8663a" stroke-width="1"/>
    <text x="12" y="40" text-anchor="middle" font-size="10" fill="#93a5b8">Cut bait / shrimp</text>
  </g>

  <!-- Legend box -->
  <rect x="15" y="245" width="470" height="62" rx="6" fill="#0f2032" stroke="#2c4a68" stroke-width="1" filter="url(#softShadow)"/>
  <text x="30" y="264" font-size="11" fill="#e8eef3" font-weight="bold">How it works:</text>
  <text x="30" y="282" font-size="10.5" fill="#c8d3dd">Fish picks up bait and swims away. The line slides freely through the sinker,</text>
  <text x="30" y="297" font-size="10.5" fill="#c8d3dd">so the fish feels no resistance. Circle hook sets itself in the corner of the jaw.</text>
</svg>
