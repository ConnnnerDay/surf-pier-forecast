<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="Arial, sans-serif">
  <defs>
    <radialGradient id="beadGrad_e74c3c" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffc9bd"/>
      <stop offset="55%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
  </defs>
  <defs>
    <radialGradient id="baitGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="45%" stop-color="#e8b48a"/>
      <stop offset="100%" stop-color="#b5794a"/>
    </radialGradient>
    <filter id="glossBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="steelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="45%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="leadGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="35%" stop-color="#9a9a9a"/>
      <stop offset="75%" stop-color="#5c5c5c"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Float Rig (Bobber Rig)</text>

  <!-- Water surface -->
  <path d="M30 100 Q80 90 130 100 Q180 110 230 100 Q280 90 330 100 Q380 110 430 100 Q460 95 470 100" fill="none" stroke="#4a9eda" stroke-width="2" opacity="0.5"/>
  <text x="495" y="95" text-anchor="end" font-size="10" fill="#4a9eda">Surface</text>

  <!-- Main line to float -->
  <line x1="30" y1="80" x2="200" y2="80" stroke="#2a6" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="30" y1="79.2" x2="200" y2="79.2" stroke="#8fe6b8" stroke-width="0.96" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="115" y="72" text-anchor="middle" font-size="11" fill="#555">Main line</text>

  <!-- Float / bobber -->
  <g transform="translate(220, 75)">
    <ellipse cx="20" cy="18" rx="18" ry="22" fill="url(#beadGrad_e74c3c)" stroke="#c0392b" stroke-width="2"/>
    <ellipse cx="20" cy="8" rx="14" ry="10" fill="url(#beadGrad_e74c3c)" stroke="#c0392b" stroke-width="0"/>
    <rect x="18" y="-8" width="4" height="16" fill="url(#steelGradDark)"/>
    <text x="52" y="10" font-size="12" fill="#555" font-weight="bold">Float</text>
    <text x="52" y="24" font-size="10" fill="#888">Popping cork,</text>
    <text x="52" y="36" font-size="10" fill="#888">cigar, or balloon</text>
  </g>

  <!-- Leader line going down -->
  <line x1="240" y1="118" x2="240" y2="280" stroke="#5da" stroke-width="2.5"/>
  <line x1="240" y1="117.4" x2="240" y2="279.4" stroke="#e8fbf3" stroke-width="0.85" opacity="0.55"/>

  <!-- Depth annotation -->
  <line x1="210" y1="120" x2="210" y2="275" stroke="#c44" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M210 124 L206 132 M210 124 L214 132" fill="none" stroke="#c44" stroke-width="1.2"/>
  <path d="M210 272 L206 264 M210 272 L214 264" fill="none" stroke="#c44" stroke-width="1.2"/>
  <text x="195" y="200" text-anchor="end" font-size="10" fill="#c44" transform="rotate(-90, 195, 200)">Adjustable depth (2-15 ft)</text>

  <!-- Leader label -->
  <text x="260" y="200" font-size="11" fill="#555">Leader</text>
  <text x="260" y="215" font-size="10" fill="#888">Wire or 30-50 lb</text>
  <text x="260" y="228" font-size="10" fill="#888">fluorocarbon</text>

  <!-- Small split shot (optional) -->
  <circle cx="240" cy="250" r="4" fill="url(#steelGrad)" stroke="#3a3a3a" stroke-width="1" filter="url(#softShadow)"/>
  <ellipse cx="238.7" cy="248.6" rx="1.3" ry="1.3" fill="#ffffff" opacity="0.5" filter="url(#glossBlur)"/>
  <text x="260" y="254" font-size="9" fill="#888">Split shot (optional)</text>

  <!-- Hook -->
  <g transform="translate(227, 280)">
    <path d="M13 0 L13 22 Q13 36 24 36 Q34 36 34 24 Q34 16 28 12" fill="none" stroke="url(#steelGrad)" stroke-width="2.5" filter="url(#softShadow)"/>
    <circle cx="27" cy="11" r="2" fill="url(#steelGradDark)"/>
    <text x="42" y="16" font-size="11" fill="#555">Circle or</text>
    <text x="42" y="30" font-size="11" fill="#555">J-hook</text>
  </g>

  <!-- Bait -->
  <g transform="translate(215, 315)">
    <path d="M10 0 Q20 -4 30 0 Q35 5 30 10 Q20 14 10 10 Q5 5 10 0" fill="url(#baitGrad)" stroke="#a8663a" stroke-width="1"/>
    <text x="20" y="26" text-anchor="middle" font-size="10" fill="#888">Live bait / shrimp</text>
  </g>

  <!-- Legend -->
  <rect x="15" y="348" width="470" height="48" rx="6" fill="#f7f9fc" stroke="#ccd" stroke-width="1"/>
  <text x="30" y="365" font-size="11" fill="#333" font-weight="bold">How it works:</text>
  <text x="30" y="380" font-size="10.5" fill="#555">The float holds bait at a fixed depth in the water column — slide it up or down the</text>
  <text x="30" y="392" font-size="10.5" fill="#555">line to match where fish are actually feeding.</text>
</svg>
