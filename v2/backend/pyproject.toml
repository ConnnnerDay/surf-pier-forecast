[tool.ruff]
line-length = 100
target-version = "py311"
# alembic/versions is auto-generated; the rest are ported verbatim from v1
# (docs/V2_PLAN.md §2) and carry v1's own lint debt — not this project's to
# fix as a side effect of the port. New code belongs in app/.
extend-exclude = [
    "alembic/versions",
    "domain",
    "services",
    "storage",
    "locations.py",
    "regulations.py",
    "utils.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Same rationale as the ruff excludes above: these are ported unchanged from
# v1 and weren't mypy-clean there either. Still type-checked enough to
# resolve imports/signatures at call sites in app/, just not held to this
# project's stricter bar internally.
[[tool.mypy.overrides]]
module = ["domain.*", "services.*", "storage.*", "locations", "regulations", "utils"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
