<nav class="site-nav" aria-label="Site navigation">
  <div class="site-nav-inner">
    <a href="{{ url_for('views.index') }}" class="site-nav-link{% if request.endpoint == 'views.index' %} site-nav-active{% endif %}" aria-current="{% if request.endpoint == 'views.index' %}page{% else %}false{% endif %}">Forecast</a>
    <a href="{{ url_for('views.setup') }}" class="site-nav-link{% if request.endpoint == 'views.setup' %} site-nav-active{% endif %}" aria-current="{% if request.endpoint == 'views.setup' %}page{% else %}false{% endif %}">Location</a>
    {% if user %}<a href="{{ url_for('views.profile') }}" class="site-nav-link{% if request.endpoint == 'views.profile' %} site-nav-active{% endif %}" aria-current="{% if request.endpoint == 'views.profile' %}page{% else %}false{% endif %}">Profile</a>{% endif %}
    <a href="{{ url_for('views.fishing_log') }}" class="site-nav-link{% if request.endpoint == 'views.fishing_log' %} site-nav-active{% endif %}" aria-current="{% if request.endpoint == 'views.fishing_log' %}page{% else %}false{% endif %}">Fish Log</a>
    <a href="{{ url_for('views.live_cams') }}" class="site-nav-link{% if request.endpoint == 'views.live_cams' %} site-nav-active{% endif %}" aria-current="{% if request.endpoint == 'views.live_cams' %}page{% else %}false{% endif %}">Live Cams</a>
    {% if user %}
    <a href="{{ url_for('auth.account') }}" class="site-nav-link{% if request.endpoint in ('auth.account', 'auth.account_settings') %} site-nav-active{% endif %}" aria-current="{% if request.endpoint in ('auth.account', 'auth.account_settings') %}page{% else %}false{% endif %}">Account</a>
    {% else %}
    <a href="{{ url_for('auth.login') }}" class="site-nav-link{% if request.endpoint in ('auth.login', 'auth.register') %} site-nav-active{% endif %}">Log In</a>
    {% endif %}
  </div>
</nav>
