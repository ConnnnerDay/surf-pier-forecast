<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Signing in…' if ok else 'Sign-in failed' }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #f0f4f8; color: #2d3748;
        }
        .box {
            text-align: center; padding: 2.5rem 2rem;
            background: #fff; border-radius: 14px;
            box-shadow: 0 4px 32px rgba(0,0,0,.10);
            max-width: 340px; width: 100%;
        }
        .icon { font-size: 2.8rem; margin-bottom: .75rem; }
        p { color: #5c6b73; margin: .5rem 0 1.5rem; font-size: .95rem; line-height: 1.5; }
        button {
            background: #0e5f78; color: #fff; border: none;
            border-radius: 8px; padding: .6rem 1.6rem;
            font-size: .9rem; cursor: pointer; font-weight: 600;
        }
        button:hover { opacity: .85; }
    </style>
</head>
<body>
    <div class="box">
        {% if ok %}
        <div class="icon">&#10003;</div>
        <p>Signed in! Redirecting&hellip;</p>
        {% else %}
        <div class="icon">&#10007;</div>
        <p>{{ error }}</p>
        <button onclick="window.close()">Close</button>
        {% endif %}
    </div>
    <script>
    (function () {
        {% if ok %}
        var dest = {{ redirect|tojson }};
        if (window.opener && !window.opener.closed) {
            try {
                window.opener.postMessage({ ok: true, redirect: dest }, window.location.origin);
                window.close();
                return;
            } catch (e) {}
        }
        window.location.href = dest;
        {% else %}
        var errMsg = {{ error|tojson }};
        if (window.opener && !window.opener.closed) {
            try {
                window.opener.postMessage({ ok: false, error: errMsg }, window.location.origin);
                window.close();
            } catch (e) {}
        }
        {% endif %}
    }());
    </script>
</body>
</html>
