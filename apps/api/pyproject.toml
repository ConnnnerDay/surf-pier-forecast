[project]
name = "surf-pier-api"
version = "0.0.0"
description = "Forecast API for Surf & Pier Forecast"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "httpx2==2.9.1",
  "mypy==2.3.0",
  "pytest==8.4.2",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surf_pier_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["surf_pier_api"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
